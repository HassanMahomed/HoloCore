[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "holocore"
version = "1.0.0"
description = "HoloCore Context Engine: local-first project knowledge, code maps, conversation memory, and agent activity"
requires-python = ">=3.11"
dependencies = ["pypdf>=5.0"]
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "HoloCore Contributors" }]
keywords = ["ai-context", "claude", "knowledge-graph", "local-first", "mcp", "second-brain"]

[project.scripts]
holocore = "holocore.cli:main"
holocore-mcp = "holocore.mcp_server:main"

[project.gui-scripts]
holocore-setup = "holocore.setup_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
