<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">HoloCore v1.1.0 stable release workflow</title>
  <desc id="desc">The v1.1.0 release workflow checks Code Map, Memories, Knowledge, Windows installers, checksums, provenance, and lifecycle behavior.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#1D1B2E"/><stop offset="1" stop-color="#2C2940"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1D1B2E" flood-opacity=".45"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#C0521F"/></marker>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" fill="#F3EDE4" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">HoloCore v1.1.0 release checks</text>
  <text x="70" y="112" fill="#D8CCBD" font-family="Segoe UI,Arial,sans-serif" font-size="20">The stable release verifies product behavior, Windows install lifecycle, and build provenance.</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="70" y="170" width="360" height="220" rx="22" fill="#3C3140" stroke="#C0521F" stroke-width="3"/>
    <text x="105" y="225" fill="#C0521F" font-size="26" font-weight="700">1 · Code Map</text>
    <text x="105" y="270" fill="#F3EDE4" font-size="19">Build the structural map</text>
    <text x="105" y="305" fill="#D8CCBD" font-size="17">Clusters · audit · explain</text>
    <text x="105" y="337" fill="#D8CCBD" font-size="17">Queries · exports · freshness</text>

    <rect x="520" y="170" width="360" height="220" rx="22" fill="#5A2E3F" stroke="#8D3E2C" stroke-width="3"/>
    <text x="555" y="225" fill="#DA8230" font-size="26" font-weight="700">2 · Memories</text>
    <text x="555" y="270" fill="#F3EDE4" font-size="19">Remember project history</text>
    <text x="555" y="305" fill="#D8CCBD" font-size="17">Mine · retrieve · diary</text>
    <text x="555" y="337" fill="#D8CCBD" font-size="17">Consolidate · preserve provenance</text>

    <rect x="970" y="170" width="360" height="220" rx="22" fill="#3B2D34" stroke="#F3B33D" stroke-width="3"/>
    <text x="1005" y="225" fill="#F3B33D" font-size="26" font-weight="700">3 · Knowledge</text>
    <text x="1005" y="270" fill="#F3EDE4" font-size="19">Keep verified knowledge</text>
    <text x="1005" y="305" fill="#D8CCBD" font-size="17">Promote · deduplicate · link</text>
    <text x="1005" y="337" fill="#D8CCBD" font-size="17">Obsidian-ready Markdown</text>
  </g>
  <path d="M430 280h80M880 280h90" stroke="#C0521F" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M250 430v74M700 430v74M1150 430v74" stroke="#C0521F" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="200" y="520" width="1000" height="150" rx="24" fill="#2C2940" stroke="#F3B33D" stroke-width="3"/>
    <text x="250" y="575" fill="#F3B33D" font-size="27" font-weight="700">4 · Verified v1.1.0 release gate</text>
    <text x="250" y="614" fill="#F3EDE4" font-size="19">Tests · UI · install · upgrade · rollback · uninstall · SBOM</text>
    <text x="250" y="646" fill="#D8CCBD" font-size="17">Only checksummed, version-bound artifacts that pass the complete lifecycle are published.</text>
  </g>
</svg>
