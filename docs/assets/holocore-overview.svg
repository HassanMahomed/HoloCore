<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">HoloCore v1.1 Home and project architecture</title>
  <desc id="desc">People and AI clients use HoloCore's local Control Centre and engine. One user-selected Home contains verified Knowledge, project Code Maps, scoped Memories, chat history, and shared AI-client connections.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1D1B2E"/><stop offset="1" stop-color="#3C3140"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#1D1B2E" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#C0521F"/></marker>
    <style>
      .f{font-family:Inter,Segoe UI,Arial,sans-serif}.title{font-size:32px;font-weight:700;fill:#F3EDE4}.sub{font-size:15px;fill:#D8CCBD}.h{font-size:20px;font-weight:700;fill:#F3EDE4}.p{font-size:14px;fill:#D8CCBD}.n{font-size:12px;fill:#B9A99B}.line{stroke:#C0521F;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#C0521F;stroke-width:2;stroke-dasharray:7 7;fill:none}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1090" cy="65" r="190" fill="#C0521F" opacity=".08"/><circle cx="90" cy="620" r="210" fill="#F3B33D" opacity=".06"/>
  <text x="60" y="58" class="f title">HoloCore 1.1: one private Home, focused project context</text>
  <text x="60" y="88" class="f sub">Verified Knowledge, Code Maps, Memories, chat history, and AI connections stay local and reviewable.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="135" width="230" height="150" rx="18" fill="#3C3140" stroke="#8D3E2C"/>
    <text x="170" y="176" text-anchor="middle" class="f h">People + AI clients</text>
    <text x="85" y="211" class="f p">Claude • Codex • Cursor</text>
    <text x="85" y="238" class="f p">Gemini • OpenCode • CLI</text>
    <text x="85" y="263" class="f n">project commands, skills, MCP</text>
  </g>
  <path d="M285 210H365" class="line"/>

  <g filter="url(#shadow)">
    <rect x="375" y="125" width="450" height="170" rx="22" fill="#3C3140" stroke="#C0521F" stroke-width="2"/>
    <text x="600" y="165" text-anchor="middle" class="f h">HoloCore Engine</text>
    <rect x="410" y="190" width="170" height="64" rx="12" fill="#2C2940" stroke="#C0521F"/>
    <text x="495" y="216" text-anchor="middle" class="f p">CLI + lifecycle</text>
    <text x="495" y="239" text-anchor="middle" class="f n">setup • update • sync-all</text>
    <rect x="620" y="190" width="170" height="64" rx="12" fill="#2C2940" stroke="#C0521F"/>
    <text x="705" y="216" text-anchor="middle" class="f p">MCP + hooks</text>
    <text x="705" y="239" text-anchor="middle" class="f n">search • capture • promote</text>
    <text x="600" y="279" text-anchor="middle" class="f n">check first • one-pass route • explicit Shared writes • local-first</text>
  </g>

  <path d="M530 295V340H305V375" class="line"/>
  <path d="M670 295V340H895V375" class="line"/>

  <g filter="url(#shadow)">
    <rect x="55" y="380" width="500" height="220" rx="20" fill="#3B2D34" stroke="#F3B33D" stroke-width="2"/>
    <text x="305" y="417" text-anchor="middle" class="f h">One user-selected HoloCore Home</text>
    <text x="305" y="441" text-anchor="middle" class="f n">&lt;Home&gt;/Knowledge = one Obsidian-ready vault</text>
    <rect x="85" y="466" width="275" height="105" rx="14" fill="#3B2D34" stroke="#F3B33D"/>
    <text x="222" y="496" text-anchor="middle" class="f p">Projects/&lt;project-id&gt;</text>
    <text x="108" y="524" class="f n">verified project notes</text>
    <text x="108" y="547" class="f n">automatic memory promotion</text>
    <rect x="380" y="466" width="145" height="105" rx="14" fill="#3B2D34" stroke="#F3B33D"/>
    <text x="452" y="496" text-anchor="middle" class="f p">Shared</text>
    <text x="452" y="524" text-anchor="middle" class="f n">explicit</text>
    <text x="452" y="547" text-anchor="middle" class="f n">cross-project notes</text>
    <text x="305" y="588" text-anchor="middle" class="f n">Project registry tracks projects; search reads the active project + Shared</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="645" y="380" width="500" height="220" rx="20" fill="#5A2E3F" stroke="#8D3E2C" stroke-width="2"/>
    <text x="895" y="417" text-anchor="middle" class="f h">Active project: mapped structure and history</text>
    <text x="895" y="441" text-anchor="middle" class="f n">&lt;Home&gt;/Projects keeps Code Map outputs and private runtime</text>
    <rect x="675" y="466" width="135" height="105" rx="14" fill="#5A2E3F" stroke="#DA8230"/>
    <text x="742" y="496" text-anchor="middle" class="f p">Code Map</text>
    <text x="742" y="524" text-anchor="middle" class="f n">files + relationships</text>
    <text x="742" y="547" text-anchor="middle" class="f n">graph.json + .html</text>
    <rect x="827" y="466" width="135" height="105" rx="14" fill="#5A2E3F" stroke="#C0521F"/>
    <text x="894" y="496" text-anchor="middle" class="f p">Memories</text>
    <text x="894" y="524" text-anchor="middle" class="f n">scoped history</text>
    <text x="894" y="547" text-anchor="middle" class="f n">SQLite memory</text>
    <rect x="979" y="466" width="135" height="105" rx="14" fill="#5A2E3F" stroke="#DA8230"/>
    <text x="1046" y="496" text-anchor="middle" class="f p">Capture</text>
    <text x="1046" y="524" text-anchor="middle" class="f n">raw chats</text>
    <text x="1046" y="547" text-anchor="middle" class="f n">cursor state</text>
    <text x="895" y="588" text-anchor="middle" class="f n">Legacy path aliases remain available for existing integrations</text>
  </g>

  <path d="M827 520H570" class="dash"/>
  <text x="698" y="508" text-anchor="middle" class="f n">reviewed memory can promote into project Knowledge</text>
  <text x="600" y="642" text-anchor="middle" class="f sub">Knowledge says what is trusted • Code Map shows connections • Memories recall what happened</text>
</svg>
