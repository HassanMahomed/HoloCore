name: Windows release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-executable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked build runtime
        run: python -m pip install uv==0.11.28
      - name: Sync locked project dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run --with pytest==9.0.2 pytest -q
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $stableTag = "v$version"
          $releaseCandidatePattern = '^' + [regex]::Escape($stableTag) + '-rc\.[1-9][0-9]*$'
          if ($env:GITHUB_REF_NAME -ne $stableTag -and $env:GITHUB_REF_NAME -notmatch $releaseCandidatePattern) {
            throw "Tag $env:GITHUB_REF_NAME must be $stableTag or a numbered release candidate such as $stableTag-rc.1"
          }
      - name: Build self-contained executable
        shell: pwsh
        run: >-
          uv run --with pyinstaller==6.16.0 pyinstaller --clean --noconfirm --onefile
          --name holocore-windows-x64
          --icon docs/assets/holocore-icon.ico
          --paths src
          --collect-submodules holocore
          --add-data "src/holocore/obsidian_plugin;holocore/obsidian_plugin"
          src/holocore/__main__.py
      - name: Detect optional release signing credentials
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          SIGNING_CERTIFICATE: ${{ secrets.HOLOCORE_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.HOLOCORE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:SIGNING_PASSWORD)
          if ($hasCertificate -ne $hasPassword) { throw 'Configure both HoloCore signing secrets or neither of them.' }
          $enabled = $hasCertificate -and $hasPassword
          "HOLOCORE_SIGNING_ENABLED=$($enabled.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($enabled) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\holocore-signing.pfx", [Convert]::FromBase64String($env:SIGNING_CERTIFICATE))
          } else {
            Write-Host 'Publishing a checksum-verified community release without Authenticode signing.'
          }
      - name: Sign engine executable
        if: startsWith(github.ref, 'refs/tags/') && env.HOLOCORE_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          SIGNING_PASSWORD: ${{ secrets.HOLOCORE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if ($null -eq $signtool) { throw 'signtool.exe was not found.' }
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\holocore-signing.pfx" /p $env:SIGNING_PASSWORD dist\holocore-windows-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Engine Authenticode signing failed.' }
          & $signtool.FullName verify /pa /v dist\holocore-windows-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Engine Authenticode verification failed.' }
      - name: Build native setup application
        shell: pwsh
        run: >-
          uv run --with pyinstaller==6.16.0 pyinstaller --clean --noconfirm --onefile --windowed
          --name holocore-setup-windows-x64
          --icon docs/assets/holocore-icon.ico
          --paths src
          --collect-submodules holocore
          --add-data "docs/assets/holocore-icon.png;holocore-assets"
          --add-data "docs/assets/holocore-icon-48.png;holocore-assets"
          --add-data "docs/assets/holocore-icon-96.png;holocore-assets"
          --add-data "install.ps1;holocore-assets"
          --add-data "src/holocore/obsidian_plugin;holocore/obsidian_plugin"
          --add-binary "dist/holocore-windows-x64.exe;holocore-payload"
          src/holocore/setup_app.py
      - name: Sign setup executable
        if: startsWith(github.ref, 'refs/tags/') && env.HOLOCORE_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          SIGNING_PASSWORD: ${{ secrets.HOLOCORE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if ($null -eq $signtool) { throw 'signtool.exe was not found.' }
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\holocore-signing.pfx" /p $env:SIGNING_PASSWORD dist\holocore-setup-windows-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Setup Authenticode signing failed.' }
          & $signtool.FullName verify /pa /v dist\holocore-setup-windows-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Setup Authenticode verification failed.' }
      - name: Execute built release artifacts
        shell: pwsh
        run: |
          $expected = uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $cliVersion = (& .\dist\holocore-windows-x64.exe --version | Out-String).Trim()
          $setupVersion = (& .\dist\holocore-setup-windows-x64.exe --version | Out-String).Trim()
          if ($cliVersion -ne $expected) { throw "CLI artifact reports $cliVersion; expected $expected" }
          if ($setupVersion -ne $expected) { throw "Setup artifact reports $setupVersion; expected $expected" }
          & .\dist\holocore-setup-windows-x64.exe --ui-smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Built Setup native UI smoke test failed" }
          & .\dist\holocore-setup-windows-x64.exe --uninstall-ui-smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Built Setup uninstaller UI smoke test failed" }
          & .\dist\holocore-setup-windows-x64.exe --desktop-ui-smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Built desktop control centre smoke test failed" }
          & .\dist\holocore-setup-windows-x64.exe --embedded-install-smoke-test --install-dir "$env:RUNNER_TEMP\holocore-embedded-smoke"
          if ($LASTEXITCODE -ne 0) { throw "Built Setup embedded install smoke test failed" }
          & .\dist\holocore-windows-x64.exe --json --root "$env:RUNNER_TEMP\holocore-smoke" init --no-git --home "$env:RUNNER_TEMP\holocore-home" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Built CLI smoke setup failed" }
          & .\dist\holocore-windows-x64.exe --json --root "$env:RUNNER_TEMP\holocore-smoke" status | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Built CLI smoke status failed" }
      - name: Create reproducible CycloneDX SBOM
        shell: pwsh
        run: >-
          uvx --from cyclonedx-bom==7.2.1 cyclonedx-py environment .venv
          --pyproject pyproject.toml --mc-type application --sv 1.6
          --output-reproducible --of JSON -o dist/holocore-sbom.cdx.json
      - name: Create checksums and immutable release manifest
        shell: pwsh
        run: |
          $assets = @{}
          foreach ($name in @('holocore-windows-x64.exe', 'holocore-setup-windows-x64.exe')) {
            $hash = (Get-FileHash -Algorithm SHA256 (Join-Path dist $name)).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content -Encoding ascii (Join-Path dist "$name.sha256")
            $assets[$name] = @{ sha256 = $hash }
          }
          $version = (& .\dist\holocore-windows-x64.exe --version | Out-String).Trim()
          $signature = Get-AuthenticodeSignature -LiteralPath .\dist\holocore-windows-x64.exe
          $tagged = $env:GITHUB_REF -like 'refs/tags/*'
          $signingEnabled = $env:HOLOCORE_SIGNING_ENABLED -eq 'true'
          if ($signingEnabled -and ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate)) { throw 'Configured Authenticode signing did not produce a valid signature.' }
          $signing = @{
            required = $signingEnabled
            thumbprint = if ($signature.SignerCertificate) { $signature.SignerCertificate.Thumbprint } else { '' }
            subject = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { '' }
          }
          $releaseTag = if ($tagged) { $env:GITHUB_REF_NAME } else { "v$version" }
          @{ schema_version = 2; version = $version; tag = $releaseTag; assets = $assets; signing = $signing } |
            ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 dist\release-manifest.json
      - name: Execute release install lifecycle
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (& .\dist\holocore-windows-x64.exe --version | Out-String).Trim()
          $releaseTag = $env:GITHUB_REF_NAME
          $install = Join-Path $env:RUNNER_TEMP 'holocore-lifecycle-install'
          $lifecycleHome = Join-Path $env:RUNNER_TEMP 'holocore-lifecycle-home'
          $project = Join-Path $env:RUNNER_TEMP 'holocore-lifecycle-project'
          & .\install.ps1 -Version $releaseTag -Yes -NoUI -InstallDir $install -ReleaseDirectory .\dist -Home $lifecycleHome -Project $project
          if ($LASTEXITCODE -ne 0) { throw 'Clean install lifecycle failed.' }
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\HoloCore'
          $registration = Get-ItemProperty -LiteralPath $uninstallKey
          if ($registration.DisplayVersion -ne $version) { throw 'Installed Apps registration has the wrong version.' }
          if ($registration.UninstallString -notmatch '--uninstall') { throw 'Installed Apps registration has no graphical uninstaller.' }
          $programs = [Environment]::GetFolderPath('Programs')
          if (-not (Test-Path -LiteralPath (Join-Path $programs 'HoloCore Setup.lnk'))) { throw 'Setup shortcut was not created.' }
          if (-not (Test-Path -LiteralPath (Join-Path $programs 'Uninstall HoloCore.lnk'))) { throw 'Uninstall shortcut was not created.' }
          if (-not (Test-Path -LiteralPath (Join-Path $programs 'HoloCore Control Centre.lnk'))) { throw 'Control Centre shortcut was not created.' }
          & (Join-Path $install 'holocore.exe') --root $project --json status | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI status failed.' }
          $vault = Join-Path $env:RUNNER_TEMP 'holocore-obsidian-vault'
          New-Item -ItemType Directory -Force -Path (Join-Path $vault '.obsidian') | Out-Null
          & (Join-Path $install 'holocore.exe') obsidian-plugin install --vault $vault | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Obsidian board plugin install failed.' }
          foreach ($file in 'manifest.json', 'main.js', 'styles.css', 'data.json') {
            if (-not (Test-Path -LiteralPath (Join-Path $vault ".obsidian\plugins\holocore-board\$file"))) { throw "Obsidian board plugin is missing $file." }
          }
          & (Join-Path $install 'holocore.exe') board --days 0 | ConvertFrom-Json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Board data command failed.' }
          & (Join-Path $install 'holocore.exe') obsidian-plugin uninstall --vault $vault | Out-Host
          if (Test-Path -LiteralPath (Join-Path $vault '.obsidian\plugins\holocore-board')) { throw 'Obsidian board plugin was not removed.' }
          & .\install.ps1 -Version $releaseTag -Yes -UpgradeOnly -InstallDir $install -ReleaseDirectory .\dist -Home $lifecycleHome
          if (-not (Test-Path -LiteralPath (Join-Path $install 'holocore.exe.previous'))) { throw 'Upgrade did not retain rollback engine.' }
          & .\install.ps1 -Rollback -InstallDir $install
          if ($LASTEXITCODE -ne 0) { throw 'Rollback lifecycle failed.' }
          & .\install.ps1 -Uninstall -InstallDir $install
          if (Test-Path -LiteralPath $install) { throw 'Uninstall left application files behind.' }
          if (Test-Path -LiteralPath $uninstallKey) { throw 'Uninstall left the Installed Apps registration behind.' }
          if (Test-Path -LiteralPath (Join-Path $programs 'HoloCore Setup.lnk')) { throw 'Uninstall left the Setup shortcut behind.' }
          if (Test-Path -LiteralPath (Join-Path $programs 'Uninstall HoloCore.lnk')) { throw 'Uninstall left its Start menu shortcut behind.' }
          if (Test-Path -LiteralPath (Join-Path $programs 'HoloCore Control Centre.lnk')) { throw 'Uninstall left the Control Centre shortcut behind.' }
          if (-not (Test-Path -LiteralPath $lifecycleHome)) { throw 'Uninstall removed HoloCore Home.' }
      - uses: actions/upload-artifact@v4
        with:
          name: holocore-windows-x64
          path: |
            dist/holocore-windows-x64.exe
            dist/holocore-windows-x64.exe.sha256
            dist/holocore-setup-windows-x64.exe
            dist/holocore-setup-windows-x64.exe.sha256
            dist/release-manifest.json
            dist/holocore-sbom.cdx.json
            install.ps1
      - name: Attest release build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/holocore-windows-x64.exe
            dist/holocore-setup-windows-x64.exe
            dist/holocore-sbom.cdx.json
      - name: Attach files to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          body: |
            ## HoloCore 1.1.0

            This stable release adds the desktop Control Centre, Home backup and restore, the HoloCore Board Obsidian plugin, and SQLite reliability improvements. See the [release notes](https://github.com/HassanMahomed/HoloCore/blob/main/docs/v1.1.0.md).

            ## Windows installation

            **Primary:** PowerShell: `irm https://github.com/HassanMahomed/HoloCore/releases/latest/download/install.ps1 | iex`

            **Alternative:** download `holocore-setup-windows-x64.exe` for guided installation.

            SHA-256 checksums, the release manifest, SBOM, install script, and GitHub build provenance are published with the release.

            ## Code signing policy

            HoloCore publishes checksum-verified unsigned community builds until its SignPath Foundation application is accepted and integrated. Future signed builds will use free code signing provided by SignPath.io, certificate by SignPath Foundation.

            See the [HoloCore code signing policy](https://github.com/HassanMahomed/HoloCore/blob/main/docs/code-signing-policy.md).
          files: |
            dist/holocore-windows-x64.exe
            dist/holocore-windows-x64.exe.sha256
            dist/holocore-setup-windows-x64.exe
            dist/holocore-setup-windows-x64.exe.sha256
            dist/release-manifest.json
            dist/holocore-sbom.cdx.json
            install.ps1
