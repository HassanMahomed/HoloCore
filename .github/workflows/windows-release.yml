name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-executable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install . pyinstaller pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Build self-contained executable
        shell: pwsh
        run: >-
          pyinstaller --clean --noconfirm --onefile
          --name holocore-windows-x64
          --paths src
          --collect-submodules holocore
          src/holocore/__main__.py
      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist/holocore-windows-x64.exe).Hash.ToLowerInvariant()
          "$hash  holocore-windows-x64.exe" | Set-Content -Encoding ascii dist/holocore-windows-x64.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: holocore-windows-x64
          path: |
            dist/holocore-windows-x64.exe
            dist/holocore-windows-x64.exe.sha256
            install.ps1
      - name: Attach files to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/holocore-windows-x64.exe
            dist/holocore-windows-x64.exe.sha256
            install.ps1
